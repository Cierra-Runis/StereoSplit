[package]
name = "stereo-split"
version = "1.1.0"
edition = "2021"
description = "Send the left and right channels of system audio to two separate speakers, following the Windows volume keys"

[dependencies]
cpal = "0.15"
ringbuf = "0.4"
rubato = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
tray-icon = "0.19"
winreg = "0.52"
windows-core = "0.58"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Recovery",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
# A panic anywhere ends the whole program (which then restarts automatically)
# instead of leaving it running with a dead audio thread
panic = "abort"
